global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'botbinance'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'binance-adapter'
    static_configs:
      - targets: ['binance-adapter:8000']

  - job_name: 'risk-gateway'
    static_configs:
      - targets: ['risk-gateway:8000']

  - job_name: 'market-data-gateway'
    static_configs:
      - targets: ['market-data-gateway:8000']

  - job_name: 'freqtrade-runtime'
    static_configs:
      - targets: ['freqtrade-runtime:8080']

  - job_name: 'discord-bot'
    static_configs:
      - targets: ['discord-bot:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
