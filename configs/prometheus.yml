global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'demo'
    project: 'botbinance'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'binance-adapter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['binance-adapter:8000']

  - job_name: 'risk-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['risk-gateway:8000']

  - job_name: 'market-data-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['market-data-gateway:8000']

  - job_name: 'hermes-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['hermes-agent:8000']

  - job_name: 'loss-analyzer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loss-analyzer:8000']

  - job_name: 'model-inference'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['model-inference:8000']

  - job_name: 'experiment-orchestrator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['experiment-orchestrator:8000']

  - job_name: 'freqtrade-runtime'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['freqtrade-runtime:8080']

  # Note: reconciler dan discord-bot tidak memiliki HTTP server
  # (reconciler = asyncio loop, discord-bot = Discord gateway)
  # Monitoring keduanya dilakukan via log aggregation di Grafana Loki (opsional)

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
