global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'discord-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'discord-critical'
      repeat_interval: 10m

receivers:
  - name: 'discord-notifications'
    webhook_configs:
      - url: 'http://discord-bot:8000/webhook'
        send_resolved: true

  - name: 'discord-critical'
    webhook_configs:
      - url: 'http://discord-bot:8000/webhook'
        send_resolved: true
